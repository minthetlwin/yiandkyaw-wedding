<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Light only: opts out of browsers' automatic dark modes (Chrome Auto Dark,
         Samsung Internet, Opera) and paints light before any CSS has loaded. -->
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#faf9f6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Title, description and link-preview tags are generated at build time from src/config/share.ts. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-render-blocking: the page (and the 3D intro) never waits on the font CDN. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Allura&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Noto+Serif+Myanmar:wght@400;500&display=swap"
      onload="this.onload = null; this.rel = 'stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Allura&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Noto+Serif+Myanmar:wght@400;500&display=swap"
      />
    </noscript>
      </head>
  <body>
    <div id="root"></div>
    <noscript>Please enable JavaScript to open the invitation.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
